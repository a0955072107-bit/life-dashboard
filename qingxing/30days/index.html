<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>30 天清醒行動儀表板</title>
<style>
:root{--main:#1F3A5F;--accent:#2F5A8A;--soft:#EEF2F7}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f5f6f4;color:#1d2a33;max-width:850px;margin:auto;padding:16px;line-height:1.65}
header{background:var(--main);color:#fff;border-radius:14px;padding:22px}
header h1{margin:0;font-size:24px}header p{margin:6px 0 0;opacity:.9}
h2{color:var(--accent);margin:0 0 10px;font-size:19px}
.box{background:#fff;border:1px solid #dde3e0;border-radius:12px;padding:18px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{padding:12px;background:var(--soft);text-align:center;border-radius:8px;font-size:14px}
.num{font-size:24px;font-weight:700;color:var(--accent);display:block}
.bar{height:10px;background:#e6ebe8;border-radius:5px;overflow:hidden;margin:12px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
button{background:var(--accent);color:#fff;padding:9px 13px;border:0;border-radius:7px;font-size:15px;cursor:pointer;font-family:inherit}
button.gray{background:#6b7b84}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input,textarea,select{font:inherit;padding:8px;border:1px solid #c3cfca;border-radius:6px;width:100%}
textarea{height:95px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.day{background:#fff;color:var(--main);border:1px solid #c3cfca;padding:7px 4px;font-size:14px}
.day.done{background:var(--soft);color:var(--accent);border-color:var(--accent)}
.day.active{background:var(--main);color:#fff;border-color:var(--main)}
.day.today{box-shadow:0 0 0 2px #f0b429}
.week{font-size:13px;color:#6b7b84;margin:10px 0 4px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px;background:var(--soft);border-radius:8px;cursor:pointer}
.task input{width:22px;height:22px;flex:none;margin-top:3px}
.task.isdone span{text-decoration:line-through;color:#71808a}
.hint{font-size:14px;color:#56656e;margin:8px 0 0}
small,.muted{color:#6b7b84;font-size:13px}
.saved{color:var(--accent);font-size:13px;margin-left:8px;opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.tpl{white-space:pre-wrap;background:#f7f9f8;border-left:3px solid var(--accent);padding:10px 12px;border-radius:4px}
.tpl mark{background:#ffe8a3;padding:0 2px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
footer{text-align:center;margin:22px 0 10px;font-size:13px;color:#6b7b84}
footer a{color:var(--accent)}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr 1fr}.num{font-size:19px}.stat{padding:10px 4px;font-size:12px}.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>30 天清醒行動儀表板</h1><p id="sub">先清醒，再行動。</p></header>

<section class="box">
  <div class="stats">
    <div class="stat"><span class="num" id="sDone">0/30</span>完成天數</div>
    <div class="stat"><span class="num" id="sA">0</span><span id="sAlabel">連續天數</span></div>
    <div class="stat"><span class="num" id="sB">0</span><span id="sBlabel">今天是</span></div>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <div class="muted" id="barText"></div>
  <label class="f" for="goal">我的 30 天目標</label><input id="goal" type="text" maxlength="60" placeholder="例如：每天練英文 20 分鐘／開始經營自己的 IG"><label class="f" for="start">開始日期（用來算出今天是第幾天）</label><input id="start" type="date">
</section>

<section class="box">
  <h2>30 天任務</h2>
  <div class="muted">黃框是依開始日期算出的「今天」。點任一天可以查看或補記。</div>
  <div id="days"></div>
</section>

<section class="box">
  <h2 id="dTitle"></h2>
  <label class="task" id="taskWrap"><input type="checkbox" id="check"><span id="task"></span></label>
  <p class="hint" id="taskHint"></p>
  <label class="f" for="note">今天的紀錄</label>
  <textarea id="note" placeholder="做了什麼？卡在哪裡？有什麼感覺？"></textarea>
  <div class="muted">打勾和筆記會自動儲存<span class="saved" id="saved">✓ 已儲存</span></div>
</section>



<section class="box">
  <h2>備份資料</h2>
  <p class="muted" style="margin-top:0">資料只存在這台裝置的瀏覽器。換手機、換電腦或清除瀏覽器資料前，請先匯出備份。</p>
  <div class="btns">
    <button class="gray" onclick="exportData()">匯出備份</button>
    <button class="gray" onclick="document.getElementById('imp').click()">匯入備份</button>
    <button class="gray" onclick="resetAll()">全部重來</button>
  </div>
  <input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importData(this)">
</section>

<footer>清醒行動派｜先清醒，再行動<br>IG <a href="https://www.instagram.com/qingxing.action/" target="_blank" rel="noopener">@qingxing.action</a>　·　<a href="https://portaly.cc/qingxing.action" target="_blank" rel="noopener">電子書與免費資源</a></footer>

<script>
const CFG={
key:'qingxing30',
tasks:["寫下你現在最卡的 3 件事", "記錄今天的時間都花去哪裡", "找出最耗能的 1 個習慣", "寫下「不想再過的一天」和「想過的一天」", "盤點你手上的資源", "選出這 30 天唯一的主目標", "第 1 週檢討", "把主目標拆成 4 個每週里程碑", "把本週里程碑拆成每天 15–30 分鐘的小步驟", "固定一個每天執行的時段", "做第一個小步驟，只做 15 分鐘", "清掉一個干擾", "再完成 2 個小步驟", "第 2 週檢討", "寫下你拖延時最常說的藉口", "試試「兩分鐘開始法」", "今天不看別人的成果", "找一個人分享你的目標", "設計一個完成後的小獎勵", "做你最想逃避的那一步", "第 3 週檢討", "回頭看 Day 1 的 3 件卡關", "整理這段時間的成果", "寫一封信給 30 天前的自己", "留下 3 個有效習慣，刪掉 1 個沒用的", "先寫下下一個 30 天的主目標", "規劃 90 天方向", "第 4 週檢討", "把每天的固定時段排進下個月行事曆", "寫下 3 個「我已經是會行動的人」的證據"],
hints:["先不用解決，只要寫清楚。寫出來，腦袋才有空間。", "每 2–3 小時回頭記一次，不評價，只看見。", "滑手機、熬夜、一直比較……寫下它通常在什麼情境出現。", "各寫 5 句，越具體越好。", "技能、時間、人脈、可以運用的錢，各寫一行就好。", "只選一個，寫進上方「我的 30 天目標」。選不出來就選最小、最想先改變的那個。", "哪件事最有感？哪件事做不到？做不到不是失敗，是資料。", "每週一個可以檢查的小成果。", "小到你沒有理由拖。", "設好手機提醒，時段比意志力可靠。", "15 分鐘就算數，做完記得打勾。", "關掉一個通知、刪一個 App，或把桌面整理乾淨。", "記下實際花了多少時間，跟你預估的差多少。", "計畫和實際差多少？把明天的份量調到做得完。", "再替它寫一句回應，下次聽到就拿出來用。", "只承諾開始做 2 分鐘，想停就停。通常你不會停。", "改成記錄自己今天做到的 3 件事。", "朋友、家人或社群都可以，說出口會更容易做到。", "做完今天的步驟就兌現，不提前領。", "做完寫下感受，通常沒有想像中難。", "哪個方法最適合你？把它留下來。", "哪一件已經鬆動了？", "截圖、檔案、數字都算，放在同一個地方。", "告訴他你做到了什麼、學到什麼。", "不用每個方法都留，留下適合你的。", "趁現在有動力，先定方向。", "接下來 3 個月，每個月各要完成什麼？", "這 30 天最大的改變是什麼？", "讓行動變成預設，而不是靠心情。", "回頭翻這 30 天的筆記，證據都在裡面。"],
weeks:['第 1 週｜先清醒：看清現況','第 2 週｜再行動：把目標拆小','第 3 週｜穩下來：對付拖延和比較','第 4 週｜整理：看見自己的改變','收尾｜延續到下一個 30 天'],
renderStats(s,u){
  let ti=todayIndex();
  u.$('sA').textContent=u.streak+' 天';u.$('sB').textContent='Day '+ti;
  let pct=Math.round(u.done/30*100);u.$('bar').style.width=pct+'%';
  u.$('barText').textContent='已完成 '+u.done+' 天，完成率 '+pct+'%'+(u.done>=30?'｜你做到了 🎉':'');
  u.$('sub').textContent=s.goal?('我的目標：'+s.goal):'先清醒，再行動。每天 15–30 分鐘，30 天後看見自己的改變。';
},
afterImport(s){$('goal').value=s.goal||'';$('start').value=s.start||''}
};
const KEY=CFG.key;
let s={};
try{s=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){s={}}
const $=id=>document.getElementById(id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(s));let t=$('saved');t.classList.add('on');clearTimeout(persist.t);persist.t=setTimeout(()=>t.classList.remove('on'),1200)}catch(e){alert('這個瀏覽器無法儲存資料（可能是無痕模式），請改用一般模式開啟。')}}
function todayStr(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayIndex(){if(!s.start)return 1;let a=new Date(s.start+'T00:00:00'),b=new Date(todayStr()+'T00:00:00');let n=Math.round((b-a)/864e5)+1;return Math.min(Math.max(n,1),30)}
if(!s.start){s.start=todayStr();persist()}
let d=s.day||todayIndex();
function money(n){return 'NT$'+(Number(n)||0).toLocaleString('zh-TW')}
function doneCount(){return CFG.tasks.filter((_,i)=>s['c'+(i+1)]).length}
function streak(){let n=0;for(let i=todayIndex();i>=1;i--){if(s['c'+i])n++;else if(i!==todayIndex())break}return n}
function render(){
  let wrap=$('days');wrap.innerHTML='';let today=todayIndex();
  for(let w=0;w<5;w++){let from=w*7,to=Math.min(from+7,30);if(from>=30)break;
    let h=document.createElement('div');h.className='week';h.textContent=CFG.weeks[w]||('第 '+(w+1)+' 週');wrap.appendChild(h);
    let g=document.createElement('div');g.className='days';
    for(let i=from;i<to;i++){let n=i+1,b=document.createElement('button');
      b.className='day'+(s['c'+n]?' done':'')+(d==n?' active':'')+(today==n?' today':'');
      b.textContent='Day '+n+(s['c'+n]?' ✓':'');b.onclick=()=>{d=n;s.day=n;persist();render();$('dTitle').scrollIntoView({behavior:'smooth',block:'start'})};g.appendChild(b)}
    wrap.appendChild(g)}
  $('dTitle').textContent='Day '+d+(d==today?'（今天）':'');
  $('task').textContent=CFG.tasks[d-1];
  $('taskHint').textContent=(CFG.hints&&CFG.hints[d-1])||'';
  $('check').checked=!!s['c'+d];$('taskWrap').classList.toggle('isdone',!!s['c'+d]);
  $('note').value=s['n'+d]||'';
  let done=doneCount();$('sDone').textContent=done+'/30';
  CFG.renderStats(s,{done,streak:streak(),money,$});
}
$('check').onchange=()=>{s['c'+d]=$('check').checked;persist();render()};
$('note').oninput=()=>{s['n'+d]=$('note').value;clearTimeout(render.t);render.t=setTimeout(persist,500)};
function copyText(id){let el=$(id),t=el.innerText;
  const ok=()=>alert('已複製'+(el.querySelector('mark')?'，記得把黃色的地方換成對方的資訊':''));
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(ok,()=>fallback(t,ok))}else fallback(t,ok)}
function fallback(t,ok){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){prompt('請手動複製：',t)}a.remove()}
function exportData(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=KEY+'-備份-'+todayStr()+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let o=JSON.parse(r.result);if(typeof o!=='object'||!o)throw 0;if(!confirm('匯入會覆蓋目前的資料，確定嗎？'))return;s=o;d=s.day||todayIndex();persist();render();CFG.afterImport&&CFG.afterImport(s);alert('匯入完成')}catch(e){alert('這不是有效的備份檔')}inp.value=''};r.readAsText(f)}
function resetAll(){if(!confirm('會清除所有打勾、筆記和設定，確定要重來嗎？建議先匯出備份。'))return;s={start:todayStr()};d=1;persist();render();CFG.afterImport&&CFG.afterImport(s)}

$('start').onchange=()=>{if($('start').value){s.start=$('start').value;persist();d=todayIndex();render()}};
$('goal').onchange=()=>{s.goal=$('goal').value.trim();persist();render()};

CFG.afterImport&&CFG.afterImport(s);
render();
</script>
</body>
</html>
