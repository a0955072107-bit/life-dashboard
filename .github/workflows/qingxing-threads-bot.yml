# 清醒行動派 Threads 機器人：每 30 分鐘把 qingxing/threads/posts.json 裡時間到了的文字發到 Threads。說明見 qingxing/threads/README.md
name: 清醒行動派 Threads 機器人

on:
  schedule:
    - cron: '7,27,47 * * * *' # 每小時三次（UTC）；GitHub 常跳過或延後，多排幾個時段
  workflow_dispatch:
    inputs:
      dry_run:
        description: '試跑（只看會做什麼，不真的發）'
        type: boolean
        default: true

concurrency:
  group: qingxing-threads-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # 自動排程要等 Settings → Variables 設 QX_THREADS_BOT_ENABLED=true 才會跑；手動 Run 隨時可以
    if: github.event_name == 'workflow_dispatch' || vars.QX_THREADS_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 執行機器人
        run: node qingxing/threads/bot.mjs
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.QX_THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
