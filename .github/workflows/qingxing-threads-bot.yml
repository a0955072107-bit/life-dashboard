# 清醒行動派 Threads 機器人：每 30 分鐘把 qingxing/threads/posts.json 裡時間到了的文字發到 Threads。說明見 qingxing/threads/README.md
name: 清醒行動派 Threads 機器人

on:
  schedule:
    - cron: '7,27,47 * * * *' # 每小時三次（UTC）；GitHub 常跳過或延後，多排幾個時段
  workflow_dispatch:
    inputs:
      dry_run:
        description: '試跑（只看會做什麼，不真的發）'
        type: boolean
        default: true

concurrency:
  group: qingxing-threads-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    # 自動排程要等 Settings → Variables 設 QX_THREADS_BOT_ENABLED=true 才會跑；手動 Run 隨時可以
    if: github.event_name == 'workflow_dispatch' || vars.QX_THREADS_BOT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 執行機器人
        run: node qingxing/threads/bot.mjs
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.QX_THREADS_ACCESS_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}

      # GitHub 免費排程常延遲或跳過（實際約一小時一次）。如果下一則在 60 分鐘內，就在這裡等到時間再發一次，
      # 讓發文時間準一點。repo 是公開的，Actions 分鐘數不計費。
      - name: 等下一則（60 分鐘內）並發出
        if: github.event_name == 'schedule'
        run: |
          wait=$(node -e "
            const ps=require('./qingxing/threads/posts.json'); const now=Date.now();
            const next=ps.filter(p=>p.status==='ready').map(p=>new Date(p.publish_at).getTime()).filter(t=>t>now).sort((a,b)=>a-b)[0];
            const s=next?Math.ceil((next-now)/1000)+20:-1; console.log(s>0&&s<=3600?s:-1)")
          if [ "$wait" -lt 0 ]; then echo "60 分鐘內沒有要發的"; exit 0; fi
          echo "等 $wait 秒後發下一則"; sleep "$wait"
          node qingxing/threads/bot.mjs
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.QX_THREADS_ACCESS_TOKEN }}
          DRY_RUN: 'false'
