name: 清醒行動派 後台記錄寫入 Notion

# 後台「記錄」分頁按送出 → 瀏覽器呼叫 GitHub API repository_dispatch（event_type=qx-record）→ 這裡寫進 Notion 並重新同步。
on:
  repository_dispatch:
    types: [qx-record, qx-sync]   # qx-sync 只重新同步，不寫 Notion

permissions:
  contents: write

concurrency:
  group: update-qingxing
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography

      - name: 寫進 Notion
        if: github.event.action == 'qx-record'
        run: python scripts/qingxing_record.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RECORD_JSON: ${{ toJSON(github.event.client_payload) }}

      - name: 重新同步
        run: python scripts/fetch_qingxing.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          QX_DASH_PASSWORD: ${{ secrets.QX_DASH_PASSWORD }}

      - name: 提交資料
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qingxing/data.enc.json
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "qingxing: 後台記錄 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main
          git push
