name: 清醒行動派 後台記錄寫入 Notion

# 後台「記錄」分頁按送出 → 瀏覽器呼叫 GitHub API repository_dispatch（event_type=qx-record）→ 這裡寫進 Notion 並重新同步。
on:
  repository_dispatch:
    types: [qx-record, qx-sync]   # qx-sync 只重新同步，不寫 Notion

permissions:
  contents: write

# 寫 Notion 這一步不排隊：連續送出好幾筆時，GitHub 的 concurrency 只留最新一個等待中的 run，
# 舊的會被取消（11/16 因此掉了兩筆）。所以只有「重新同步＋提交」排隊，被取消也沒關係（最後一次同步會包含全部）。
jobs:
  record:
    if: github.event.action == 'qx-record'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 寫進 Notion
        run: python scripts/qingxing_record.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          RECORD_JSON: ${{ toJSON(github.event.client_payload) }}

  sync:
    needs: record
    if: ${{ !cancelled() && (needs.record.result == 'success' || needs.record.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: update-qingxing
      cancel-in-progress: false
    steps:
      # 一定要拿 main 最新版（repository_dispatch 預設拿送出當下的版本，排隊後會過時、推送時衝突）
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography

      - name: 重新同步
        run: python scripts/fetch_qingxing.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          QX_DASH_PASSWORD: ${{ secrets.QX_DASH_PASSWORD }}

      - name: 提交資料
        run: |
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data.enc.json 是整份從 Notion 重新產生的，以這次的為準；推送被擋就拿最新 main 再覆蓋一次（最多 3 次）
          cp qingxing/data.enc.json "$RUNNER_TEMP/data.enc.json"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp "$RUNNER_TEMP/data.enc.json" qingxing/data.enc.json
            git add qingxing/data.enc.json
            if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
            git commit -qm "qingxing: 後台記錄 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            if git push -q origin HEAD:main; then echo "已推送"; exit 0; fi
            echo "推送被擋，第 $i 次重試"; sleep $((i*5))
          done
          exit 1
