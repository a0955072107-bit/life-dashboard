# 清醒行動派 TikTok：每週四把下週 7 天（週日到週六）的圖卡做成直式影片，
# 連同文案放到 GitHub Releases（tiktok-YYYY-MM-DD），再到 TikTok Studio 排程。
name: 清醒行動派 TikTok 每週影片

on:
  schedule:
    - cron: '13 2 * * 4' # 每週四 10:13（台灣時間）；週五提醒 Yang 照 qingxing/tiktok/UPLOAD.md 請 Claude 排程
  # 推 qingxing/tiktok/rebuild.json（{"start":"YYYY-MM-DD","days":"N"}）也會重做，給 Claude 在沒有 Actions 權限時用
  push:
    branches: [main]
    paths:
      - qingxing/tiktok/rebuild.json
  workflow_dispatch:
    inputs:
      start:
        description: '從哪一天開始（YYYY-MM-DD，空白＝明天）'
        type: string
        default: ''
      days:
        description: '做幾天（預設 7）'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: 安裝 ffmpeg、中文字型
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-cjk
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安裝 Playwright（動態字卡用）
        run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - name: 決定起始日與天數
        id: args
        run: |
          start="${{ inputs.start }}"; days="${{ inputs.days }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            start=$(python3 -c "import json;print(json.load(open('qingxing/tiktok/rebuild.json')).get('start',''))")
            days=$(python3 -c "import json;print(json.load(open('qingxing/tiktok/rebuild.json')).get('days',''))")
          fi
          # 排程（週四）跑的時候，從下一個週日開始
          if [ -z "$start" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            start=$(TZ=Asia/Taipei date -d "next sunday" +%F)
          fi
          echo "start=$start" >> "$GITHUB_OUTPUT"; echo "days=$days" >> "$GITHUB_OUTPUT"
      - name: 產生影片
        run: python3 qingxing/scripts/build-tiktok.py "${{ steps.args.outputs.start }}" out "${{ steps.args.outputs.days }}"
      - name: 放到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start="${{ steps.args.outputs.start }}"
          [ -z "$start" ] && start=$(TZ=Asia/Taipei date -d tomorrow +%F)
          tag="tiktok-$start"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/* --title "TikTok 影片：$start 起 7 天" --notes-file "out/schedule.txt"
          echo "下載頁：https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: 更新固定網址（latest.json）與 IG Reel 貼文檔
        run: |
          set -euo pipefail
          mkdir -p qingxing/tiktok
          cp out/manifest.json qingxing/tiktok/latest.json
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qingxing/tiktok/latest.json qingxing/instagram/posts/*-reel-day*.md
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "qingxing: 更新 TikTok 本週清單＋IG Reel 貼文檔"
          git pull --rebase origin main
          git push
