# 清醒行動派 TikTok：每週六把接下來 7 天（週日到週六）的圖卡做成直式影片，
# 連同文案放到 GitHub Releases（tiktok-YYYY-MM-DD），再到 TikTok Studio 排程。
name: 清醒行動派 TikTok 每週影片

on:
  schedule:
    - cron: '13 2 * * 6' # 每週六 10:13（台灣時間）
  workflow_dispatch:
    inputs:
      start:
        description: '從哪一天開始（YYYY-MM-DD，空白＝明天）'
        type: string
        default: ''
      days:
        description: '做幾天（預設 7）'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 安裝 ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: 產生影片
        run: python3 qingxing/scripts/build-tiktok.py "${{ inputs.start }}" out "${{ inputs.days }}"
      - name: 放到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start="${{ inputs.start }}"
          [ -z "$start" ] && start=$(TZ=Asia/Taipei date -d tomorrow +%F)
          tag="tiktok-$start"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" out/* --title "TikTok 影片：$start 起 7 天" --notes-file "out/schedule.txt"
          echo "下載頁：https://github.com/${GITHUB_REPOSITORY}/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
      - name: 更新固定網址（latest.json）與 IG Reel 貼文檔
        run: |
          set -euo pipefail
          mkdir -p qingxing/tiktok
          cp out/manifest.json qingxing/tiktok/latest.json
          git config user.name "dashboard-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qingxing/tiktok/latest.json qingxing/instagram/posts/*-reel-day*.md
          if git diff --cached --quiet; then echo "沒有變更"; exit 0; fi
          git commit -m "qingxing: 更新 TikTok 本週清單＋IG Reel 貼文檔"
          git pull --rebase origin main
          git push
